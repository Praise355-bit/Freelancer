<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Freelancer — Turn Your Skill Into a Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#5B4FE9; --brand-2:#4038B8; --gold:#E8A33D; --gold-2:#C7842A;
  --bg:#FAFAF8; --bg-elevated:#FFFFFF; --bg-sunken:#F1F0FA;
  --text:#15132B; --text-muted:#66628A; --border:#E4E2F2;
  --success:#1C9A6C; --danger:#D5473C;
  --radius:14px; --radius-lg:22px;
  --shadow: 0 1px 2px rgba(21,19,43,.04), 0 8px 24px -8px rgba(21,19,43,.10);
  --font-d:'Sora',sans-serif; --font-b:'Inter',sans-serif; --font-m:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#0E0C1D; --bg-elevated:#171432; --bg-sunken:#100E22;
  --text:#F2F1FA; --text-muted:#9B97C4; --border:#2A2650;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:var(--font-b); background:var(--bg); color:var(--text); transition:background .3s,color .3s; -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-d); letter-spacing:-0.02em;}
a{color:inherit; text-decoration:none;}
button{font-family:var(--font-b); cursor:pointer;}
::selection{background:var(--brand); color:#fff;}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 24px; border-radius:100px; border:none; font-weight:600; font-size:14.5px; transition:transform .15s, box-shadow .15s, opacity .15s; white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--text); color:var(--bg);}
[data-theme="dark"] .btn-primary{background:var(--brand); color:#fff;}
.btn-primary:hover{opacity:.88;}
.btn-gold{background:var(--gold); color:#241A05;}
.btn-gold:hover{background:var(--gold-2);}
.btn-ghost{background:transparent; color:var(--text); border:1.5px solid var(--border);}
.btn-ghost:hover{border-color:var(--text);}
.btn-sm{padding:9px 16px; font-size:13px; border-radius:10px;}
.btn-block{width:100%;}
input,textarea,select{font-family:var(--font-b); background:var(--bg-elevated); border:1.5px solid var(--border); color:var(--text); padding:12px 14px; border-radius:10px; font-size:14.5px; width:100%; transition:border-color .15s;}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--brand);}
label{font-size:13px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:6px;}
.field{margin-bottom:16px;}
.card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow);}
.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:100px; font-size:12px; font-weight:600; background:var(--bg-sunken); color:var(--text-muted);}
.badge-gold{background:rgba(232,163,61,.16); color:var(--gold-2);}
[data-theme="dark"] .badge-gold{color:var(--gold);}
.muted{color:var(--text-muted);}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .7s linear infinite; display:inline-block;}
.spinner-dark{border:2px solid rgba(0,0,0,.12); border-top-color:var(--brand);}
@keyframes spin{to{transform:rotate(360deg);}}
.skeleton{background:linear-gradient(90deg,var(--bg-sunken) 25%,var(--border) 50%,var(--bg-sunken) 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:8px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.toast-host{position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--text); color:var(--bg); padding:13px 18px; border-radius:10px; font-size:13.5px; font-weight:500; box-shadow:var(--shadow); animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:translateY(0);}}
/* NAV */
.topnav{position:sticky; top:0; z-index:100; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
.topnav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:1180px; margin:0 auto;}
.logo{display:flex; align-items:center; gap:9px; font-family:var(--font-d); font-weight:800; font-size:19px;}
.logo-mark{width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--brand),var(--gold)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; font-weight:800;}
.navlinks{display:flex; gap:30px; font-size:14.5px; font-weight:500;}
.navlinks a:hover{color:var(--brand);}
.navactions{display:flex; align-items:center; gap:12px;}
.icon-btn{width:38px; height:38px; border-radius:10px; border:1.5px solid var(--border); background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; color:var(--text);}
.mobile-menu-btn{display:none;}
@media(max-width:860px){.navlinks{display:none;} .mobile-menu-btn{display:flex;}}

/* HERO */
.hero{padding:88px 24px 60px; position:relative; overflow:hidden;}
.hero-glow{position:absolute; top:-200px; left:50%; transform:translateX(-50%); width:900px; height:600px; background:radial-gradient(ellipse at center, color-mix(in srgb, var(--brand) 22%, transparent), transparent 70%); pointer-events:none;}
.hero-inner{max-width:1180px; margin:0 auto; text-align:center; position:relative;}
.eyebrow{font-family:var(--font-m); font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--brand); font-weight:600; margin-bottom:18px; display:inline-flex; align-items:center; gap:8px; background:color-mix(in srgb, var(--brand) 10%, transparent); padding:7px 14px; border-radius:100px;}
.hero h1{font-size:clamp(36px,6vw,68px); line-height:1.04; font-weight:800; max-width:920px; margin:0 auto 22px;}
.hero h1 .grad{background:linear-gradient(100deg,var(--brand),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero p.sub{font-size:clamp(16px,2vw,19px); color:var(--text-muted); max-width:600px; margin:0 auto 36px; line-height:1.55;}
.hero-actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:56px;}

/* LIVE DEMO */
.demo-box{max-width:720px; margin:0 auto; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-lg); padding:8px; box-shadow:var(--shadow); text-align:left;}
.demo-input-row{display:flex; gap:8px; padding:8px;}
.demo-input-row input{border:none; background:var(--bg-sunken); border-radius:12px; font-size:15px; padding:14px 16px;}
.demo-input-row input:focus{outline:2px solid var(--brand); outline-offset:-2px;}
.demo-result{border-top:1px solid var(--border); margin-top:4px; padding:20px; display:none;}
.demo-result.show{display:block; animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:translateY(0);}}
.demo-headline{font-family:var(--font-d); font-weight:700; font-size:20px; margin-bottom:6px;}
.demo-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;}
.tag{background:var(--bg-sunken); border-radius:100px; padding:5px 12px; font-size:12.5px; font-weight:600; color:var(--text-muted);}

/* FEATURE GRID */
.section{padding:76px 24px;}
.section-head{text-align:center; max-width:640px; margin:0 auto 50px;}
.section-head .eyebrow{margin-bottom:14px;}
.section-head h2{font-size:clamp(28px,4vw,42px); font-weight:800; margin-bottom:14px;}
.section-head p{color:var(--text-muted); font-size:16.5px; line-height:1.55;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:18px;}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr;} .grid4{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.grid3{grid-template-columns:1fr;} .grid4{grid-template-columns:1fr;}}
.feat-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:26px; transition:transform .2s, border-color .2s;}
.feat-card:hover{transform:translateY(-4px); border-color:var(--brand);}
.feat-icon{width:42px; height:42px; border-radius:12px; background:var(--bg-sunken); display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:16px;}
.feat-card h3{font-size:16.5px; margin-bottom:8px; font-weight:700;}
.feat-card p{font-size:14px; color:var(--text-muted); line-height:1.55;}

/* PRICING */
.pricing-toggle{display:flex; justify-content:center; margin-bottom:44px;}
.pricing-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; align-items:start;}
@media(max-width:900px){.pricing-grid{grid-template-columns:1fr; max-width:400px; margin:0 auto;}}
.price-card{background:var(--bg-elevated); border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:30px; position:relative;}
.price-card.featured{border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);}
.price-card .badge-gold{position:absolute; top:-13px; left:50%; transform:translateX(-50%); padding:5px 16px;}
.price-card h3{font-size:19px; margin-bottom:6px;}
.price-card .amt{font-size:38px; font-weight:800; font-family:var(--font-d); margin:14px 0 4px;}
.price-card .amt span{font-size:14px; font-weight:500; color:var(--text-muted);}
.price-card ul{list-style:none; margin:22px 0 26px; display:flex; flex-direction:column; gap:11px;}
.price-card li{font-size:14px; display:flex; gap:9px; align-items:flex-start; color:var(--text-muted);}
.price-card li b{color:var(--text); font-weight:500;}
.check{color:var(--success); flex-shrink:0; margin-top:1px;}

footer{border-top:1px solid var(--border); padding:40px 24px; text-align:center; color:var(--text-muted); font-size:13.5px;}

/* AUTH / ONBOARDING */
.center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px;}
.auth-card{width:100%; max-width:460px;}
.onboard-shell{min-height:100vh; padding:32px 20px 60px;}
.onboard-head{max-width:640px; margin:0 auto 30px; text-align:center;}
.progress-track{max-width:640px; margin:0 auto 36px; height:5px; background:var(--bg-sunken); border-radius:100px; overflow:hidden;}
.progress-bar{height:100%; background:linear-gradient(90deg,var(--brand),var(--gold)); border-radius:100px; transition:width .4s ease;}
.onboard-card{max-width:640px; margin:0 auto;}
.step-label{font-size:12.5px; font-weight:700; color:var(--brand); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:560px){.row2{grid-template-columns:1fr;}}
.chip-select{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:10px 16px; border-radius:100px; border:1.5px solid var(--border); font-size:13.5px; font-weight:600; background:var(--bg-elevated); color:var(--text-muted); transition:all .15s;}
.chip.active{background:var(--text); color:var(--bg); border-color:var(--text);}
[data-theme="dark"] .chip.active{background:var(--brand); border-color:var(--brand); color:#fff;}
.nav-buttons{display:flex; justify-content:space-between; margin-top:28px; gap:10px;}
.upload-box{border:1.5px dashed var(--border); border-radius:14px; padding:26px; text-align:center; color:var(--text-muted); font-size:13.5px; cursor:pointer;}
.upload-box:hover{border-color:var(--brand);}

/* APP SHELL */
.app-shell{display:flex; min-height:100vh;}
.sidebar{width:250px; flex-shrink:0; border-right:1px solid var(--border); background:var(--bg-elevated); padding:20px 14px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;}
.sidebar-logo{padding:8px 10px 20px;}
.side-link{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; font-size:14px; font-weight:600; color:var(--text-muted); margin-bottom:2px;}
.side-link .ic{width:18px; text-align:center;}
.side-link:hover{background:var(--bg-sunken); color:var(--text);}
.side-link.active{background:var(--text); color:var(--bg);}
[data-theme="dark"] .side-link.active{background:var(--brand); color:#fff;}
.side-section-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); padding:16px 12px 6px;}
.side-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--border);}
.usage-box{background:var(--bg-sunken); border-radius:12px; padding:14px; margin:10px 4px;}
.usage-bar-track{height:6px; background:var(--border); border-radius:100px; overflow:hidden; margin-top:8px;}
.usage-bar{height:100%; background:linear-gradient(90deg,var(--brand),var(--gold));}
.main{flex:1; min-width:0;}
.topbar{position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--border); background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(8px);}
.content{padding:28px;}
@media(max-width:900px){.sidebar{position:fixed; left:-260px; z-index:200; transition:left .25s; box-shadow:var(--shadow);} .sidebar.open{left:0;} .content{padding:18px;}}

.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px;}
@media(max-width:900px){.stat-grid{grid-template-columns:1fr 1fr;}}
.stat-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:20px;}
.stat-card .num{font-family:var(--font-d); font-size:26px; font-weight:800; margin-top:6px;}
.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:20px;}
@media(max-width:960px){.two-col{grid-template-columns:1fr;}}
.section-title{font-size:22px; font-weight:800; font-family:var(--font-d); margin-bottom:4px;}
.tab-row{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap;}
.gen-output{background:var(--bg-sunken); border-radius:14px; padding:20px; margin-top:16px; font-size:14.5px; line-height:1.7; white-space:pre-wrap;}
.copy-row{display:flex; gap:8px; margin-top:12px;}
.list-item{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; background:var(--bg-elevated);}
.avatar{width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--brand),var(--gold)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;}
.editable{border:1.5px dashed transparent; border-radius:8px; padding:4px 6px; transition:border-color .15s;}
.editable:hover{border-color:var(--border);}
.editable:focus{outline:none; border-color:var(--brand); background:var(--bg-sunken);}
table{width:100%; border-collapse:collapse; font-size:14px;}
th{text-align:left; padding:10px 12px; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--border);}
td{padding:12px; border-bottom:1px solid var(--border);}
.modal-bg{position:fixed; inset:0; background:rgba(10,8,25,.5); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;}
.modal{background:var(--bg-elevated); border-radius:var(--radius-lg); padding:28px; max-width:480px; width:100%; box-shadow:var(--shadow);}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-host" id="toastHost"></div>

<script>
/* ============ STORAGE ============ */
const S = {
  async get(key, fallback){
    try{ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; }
    catch(e){ return fallback; }
  },
  async set(key, val){
    try{ await window.storage.set(key, JSON.stringify(val)); }catch(e){ console.error('storage set failed', e); }
  }
};

/* ============ TOAST ============ */
function toast(msg){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ============ AI CALL ============ */
async function askAI(userPrompt, systemPrompt, jsonMode){
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt + (jsonMode ? '\n\nRespond ONLY with valid JSON. No markdown fences, no preamble, no commentary.' : ''),
        messages:[{role:'user', content: userPrompt}]
      })
    });
    const data = await res.json();
    let text = (data.content||[]).map(b=>b.text||'').join('\n').trim();
    if(jsonMode){
      text = text.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
      return JSON.parse(text);
    }
    return text;
  }catch(e){
    console.error('AI error', e);
    throw e;
  }
}

/* ============ STATE ============ */
let STATE = {
  theme: 'light',
  user: null,          // profile object
  portfolio: [],        // array of projects
  website: null,
  proposals: [],
  messages: [],
  pricingPkgs: null,
  social: [],
  plan: 'free',
  usage: { used: 3, limit: 10 },
  onboardStep: 0,
  onboardData: {}
};

async function loadState(){
  STATE.theme = await S.get('theme','light');
  STATE.user = await S.get('user', null);
  STATE.portfolio = await S.get('portfolio', []);
  STATE.website = await S.get('website', null);
  STATE.proposals = await S.get('proposals', []);
  STATE.messages = await S.get('messages', []);
  STATE.pricingPkgs = await S.get('pricingPkgs', null);
  STATE.social = await S.get('social', []);
  STATE.plan = await S.get('plan','free');
  STATE.usage = await S.get('usage', {used:3, limit:10});
  document.documentElement.setAttribute('data-theme', STATE.theme);
}
function toggleTheme(){
  STATE.theme = STATE.theme==='light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', STATE.theme);
  S.set('theme', STATE.theme);
}

function useCredit(){
  STATE.usage.used++;
  S.set('usage', STATE.usage);
}
function creditsLeft(){ return Math.max(0, STATE.usage.limit - STATE.usage.used); }

/* ============ ROUTER ============ */
function go(route){ location.hash = route; }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', async ()=>{ await loadState(); render(); });

function render(){
  const hash = location.hash.replace('#/','') || 'home';
  const app = document.getElementById('app');
  window.scrollTo(0,0);
  if(hash==='home') return app.innerHTML = HomePage();
  if(hash==='onboarding') return app.innerHTML = OnboardingPage();
  if(hash==='pricing') return app.innerHTML = StandalonePricingPage();
  if(hash==='admin') return app.innerHTML = AdminPage();
  if(hash.startsWith('dashboard')){
    if(!STATE.user){ go('/onboarding'); return; }
    const sub = hash.split('/')[1] || 'overview';
    app.innerHTML = DashboardShell(sub);
    afterDashboardRender(sub);
    return;
  }
  app.innerHTML = HomePage();
}

/* ============ ICONS (inline SVG-free, emoji-based for simplicity) ============ */
const ICONS = {
  overview:'▦', profile:'◍', portfolio:'▣', website:'◈', proposals:'✎', messages:'✉',
  pricing:'฿', social:'✳', subscription:'★', settings:'⚙', logout:'⏻', admin:'⛨'
};

/* ============ NAV BAR (marketing) ============ */
function TopNav(){
  return `
  <div class="topnav">
    <div class="topnav-inner">
      <a href="#/" class="logo"><span class="logo-mark">AF</span> AI Freelancer</a>
      <nav class="navlinks">
        <a href="#/" onclick="setTimeout(()=>document.getElementById('features')?.scrollIntoView({behavior:'smooth'}),50)">Features</a>
        <a href="#/pricing">Pricing</a>
        <a href="#/" onclick="setTimeout(()=>document.getElementById('howitworks')?.scrollIntoView({behavior:'smooth'}),50)">How it works</a>
      </nav>
      <div class="navactions">
        <button class="icon-btn" onclick="toggleTheme(); render();" title="Toggle theme">${STATE.theme==='light'?'☾':'☀'}</button>
        <a href="#/dashboard" class="btn btn-ghost btn-sm">Log in</a>
        <a href="#/onboarding" class="btn btn-primary btn-sm">Start for Free</a>
      </div>
    </div>
  </div>`;
}

/* ============ HOME PAGE ============ */
function HomePage(){
  return `
  ${TopNav()}
  <section class="hero">
    <div class="hero-glow"></div>
    <div class="hero-inner">
      <div class="eyebrow">● Built for African freelancers, powered by AI</div>
      <h1>Turn Your Skill Into <span class="grad">a Business</span> With AI.</h1>
      <p class="sub">Create your freelancer brand, portfolio, website and client proposals in minutes — not weeks.</p>
      <div class="hero-actions">
        <a href="#/onboarding" class="btn btn-primary">Start for Free →</a>
        <a href="#features" class="btn btn-ghost" onclick="document.getElementById('features').scrollIntoView({behavior:'smooth'})">Explore Features</a>
      </div>
      <div class="demo-box">
        <div class="demo-input-row">
          <input id="demoSkillInput" placeholder="I'm a video editor who creates TikTok, YouTube and football videos." value=""/>
          <button class="btn btn-gold" style="border-radius:12px;" onclick="runHeroDemo()" id="demoBtn">Try it</button>
        </div>
        <div class="demo-result" id="demoResult"></div>
      </div>
    </div>
  </section>

  <section class="section" id="howitworks">
    <div class="section-head">

<script>
/* ============ ONBOARDING ============ */
const ONBOARD_STEPS = ['basics','skill','services','contact','photo','portfolio','review'];

function OnboardingPage(){
  const step = STATE.onboardStep;
  const total = ONBOARD_STEPS.length;
  const pct = Math.round(((step+1)/total)*100);
  return `
  <div class="onboard-shell">
    <div style="max-width:640px;margin:0 auto 24px;"><a href="#/" class="logo"><span class="logo-mark">AF</span> AI Freelancer</a></div>
    <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="onboard-card"><div class="card">${OnboardStepBody(ONBOARD_STEPS[step])}</div></div>
  </div>`;
}

function od(key, def){ return STATE.onboardData[key] ?? def ?? ''; }
function setOd(key,val){ STATE.onboardData[key]=val; }

function OnboardStepBody(step){
  const d = STATE.onboardData;
  if(step==='basics'){
    return `
      <div class="step-label">Step 1 of 7 — The basics</div>
      <h2 style="margin-bottom:22px;">Let's get to know you</h2>
      <div class="field"><label>Full name</label><input id="f_name" value="${escapeHtml(od('name'))}" placeholder="e.g. Amaka Obi"/></div>
      <div class="row2">
        <div class="field"><label>Location</label><input id="f_location" value="${escapeHtml(od('location'))}" placeholder="e.g. Lagos, Nigeria"/></div>
        <div class="field"><label>Experience level</label>
          <div class="chip-select" id="f_experience">
            ${['Beginner','Intermediate','Experienced','Expert'].map(l=>`<span class="chip ${od('experience')===l?'active':''}" onclick="pickChip('f_experience','experience','${l}')">${l}</span>`).join('')}
          </div>
        </div>
      </div>
      ${NavButtons(false)}
    `;
  }
  if(step==='skill'){
    return `
      <div class="step-label">Step 2 of 7 — Your skill</div>
      <h2 style="margin-bottom:22px;">What do you do?</h2>
      <div class="field"><label>Describe your skill in one sentence</label>
        <textarea id="f_skill" rows="3" placeholder="I'm a video editor who creates TikTok, YouTube and football videos.">${escapeHtml(od('skill'))}</textarea>
      </div>
      <div class="field"><label>Your niche</label><input id="f_niche" value="${escapeHtml(od('niche'))}" placeholder="e.g. Sports & entertainment content"/></div>
      <div class="field"><label>Target clients</label><input id="f_targetClients" value="${escapeHtml(od('targetClients'))}" placeholder="e.g. Football creators, small brands, YouTubers"/></div>
      ${NavButtons(true)}
    `;
  }
  if(step==='services'){
    const suggested = ['Video editing','Content strategy','Thumbnail design','Short-form clipping','Motion graphics','Color grading','Sound design','YouTube management'];
    const chosen = od('services',[]);
    return `
      <div class="step-label">Step 3 of 7 — Services</div>
      <h2 style="margin-bottom:22px;">What services do you offer?</h2>
      <div class="field"><label>Pick all that apply (or add your own below)</label>
        <div class="chip-select" id="f_services">
          ${suggested.map(s=>`<span class="chip ${chosen.includes(s)?'active':''}" onclick="toggleChip('f_services','services','${s}')">${s}</span>`).join('')}
        </div>
      </div>
      <div class="field"><label>Other services (comma separated)</label><input id="f_customServices" value="${escapeHtml(od('customServices'))}" placeholder="e.g. Podcast editing, Reels strategy"/></div>
      ${NavButtons(true)}
    `;
  }
  if(step==='contact'){
    return `
      <div class="step-label">Step 4 of 7 — Contact</div>
      <h2 style="margin-bottom:22px;">How should clients reach you?</h2>
      <div class="row2">
        <div class="field"><label>Email</label><input id="f_email" type="email" value="${escapeHtml(od('email'))}" placeholder="you@email.com"/></div>
        <div class="field"><label>WhatsApp number</label><input id="f_whatsapp" value="${escapeHtml(od('whatsapp'))}" placeholder="e.g. 2348012345678"/></div>
      </div>
      ${NavButtons(true)}
    `;
  }
  if(step==='photo'){
    return `
      <div class="step-label">Step 5 of 7 — Profile photo</div>
      <h2 style="margin-bottom:22px;">Add a profile picture</h2>
      <div class="upload-box" onclick="document.getElementById('f_photo').click()">
        <div id="photoPreviewWrap">${od('photo') ? `<img src="${od('photo')}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;"/>` : '<div style="font-size:26px;">📷</div><p style="margin-top:8px;">Click to upload (optional — you can add this later)</p>'}</div>
      </div>
      <input type="file" id="f_photo" accept="image/*" class="hidden" onchange="handlePhoto(event)"/>
      ${NavButtons(false)}
    `;
  }
  if(step==='portfolio'){
    const items = od('portfolioSeed',[]);
    return `
      <div class="step-label">Step 6 of 7 — Portfolio (optional)</div>
      <h2 style="margin-bottom:22px;">Got a project or two to show?</h2>
      <p class="muted" style="margin-bottom:16px;">You can skip this and add full projects later in your dashboard.</p>
      <div class="field"><label>Project name</label><input id="pf_name" placeholder="e.g. Highlight reel for local football club"/></div>
      <div class="field"><label>Quick description</label><textarea id="pf_desc" rows="2" placeholder="What did you make and for whom?"></textarea></div>
      <button class="btn btn-ghost btn-sm" onclick="addSeedProject()">+ Add project</button>
      <div style="margin-top:14px;">${items.map((p,i)=>`<div class="list-item"><span>${escapeHtml(p.name)}</span><button class="btn btn-ghost btn-sm" onclick="removeSeedProject(${i})">Remove</button></div>`).join('')}</div>
      ${NavButtons(false)}
    `;
  }
  if(step==='review'){
    return `
      <div class="step-label">Step 7 of 7 — Ready</div>
      <h2 style="margin-bottom:10px;">Generate your freelancer brand</h2>
      <p class="muted" style="margin-bottom:20px;">AI Freelancer will now build your headline, bio, services, portfolio copy, and starter website from what you've told us.</p>
      <div class="card" style="background:var(--bg-sunken); box-shadow:none; margin-bottom:20px;">
        <p style="font-size:14px;"><b>${escapeHtml(od('name'))}</b> · ${escapeHtml(od('location'))}</p>
        <p class="muted" style="font-size:13.5px; margin-top:6px;">${escapeHtml(od('skill'))}</p>
      </div>
      <button class="btn btn-primary btn-block" id="genBtn" onclick="generateProfile()">✨ Generate My Profile</button>
      <div id="genStatus" class="muted" style="text-align:center; margin-top:12px; font-size:13.5px;"></div>
    `;
  }
}

function NavButtons(showBack){
  const step = STATE.onboardStep;
  return `<div class="nav-buttons">
    <button class="btn btn-ghost" onclick="onboardBack()" ${step===0?'style="visibility:hidden"':''}>← Back</button>
    <button class="btn btn-primary" onclick="onboardNext()">Continue →</button>
  </div>`;
}

function pickChip(containerId, field, val){
  setOd(field, val);
  render();
}
function toggleChip(containerId, field, val){
  let arr = od(field, []);
  arr = arr.includes(val) ? arr.filter(x=>x!==val) : [...arr, val];
  setOd(field, arr);
  render();
}
function handlePhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ setOd('photo', reader.result); render(); };
  reader.readAsDataURL(file);
}
function addSeedProject(){
  const name = document.getElementById('pf_name').value.trim();
  const desc = document.getElementById('pf_desc').value.trim();
  if(!name) return toast('Add a project name first');
  const arr = od('portfolioSeed', []);
  arr.push({name, desc});
  setOd('portfolioSeed', arr);
  render();
}
function removeSeedProject(i){
  const arr = od('portfolioSeed', []);
  arr.splice(i,1);
  setOd('portfolioSeed', arr);
  render();
}
function captureCurrentStepInputs(){
  const step = ONBOARD_STEPS[STATE.onboardStep];
  if(step==='basics'){ setOd('name', document.getElementById('f_name').value.trim()); setOd('location', document.getElementById('f_location').value.trim()); }
  if(step==='skill'){ setOd('skill', document.getElementById('f_skill').value.trim()); setOd('niche', document.getElementById('f_niche').value.trim()); setOd('targetClients', document.getElementById('f_targetClients').value.trim()); }
  if(step==='services'){ setOd('customServices', document.getElementById('f_customServices').value.trim()); }
  if(step==='contact'){ setOd('email', document.getElementById('f_email').value.trim()); setOd('whatsapp', document.getElementById('f_whatsapp').value.trim()); }
}
function onboardNext(){
  captureCurrentStepInputs();
  const step = ONBOARD_STEPS[STATE.onboardStep];
  if(step==='basics' && !od('name')) return toast('Please enter your name');
  if(step==='skill' && !od('skill')) return toast('Please describe your skill');
  if(step==='contact' && !od('email')) return toast('Please enter an email');
  if(STATE.onboardStep < ONBOARD_STEPS.length-1) STATE.onboardStep++;
  render();
}
function onboardBack(){
  captureCurrentStepInputs();
  if(STATE.onboardStep>0) STATE.onboardStep--;
  render();
}

async function generateProfile(){
  const btn = document.getElementById('genBtn');
  const status = document.getElementById('genStatus');
  btn.innerHTML = '<span class="spinner"></span> Generating…';
  btn.disabled = true;
  const d = STATE.onboardData;
  const allServices = [...(d.services||[]), ...((d.customServices||'').split(',').map(s=>s.trim()).filter(Boolean))];
  try{
    status.textContent = 'Writing your profile…';
    const profile = await askAI(
      `Name: ${d.name}\nSkill: ${d.skill}\nNiche: ${d.niche||'general'}\nExperience: ${d.experience||'Intermediate'}\nServices: ${allServices.join(', ')||'general services'}\nTarget clients: ${d.targetClients||'small businesses'}\nLocation: ${d.location||''}`,
      `You are an expert freelance branding copywriter for African freelancers. Given the freelancer's info, output JSON with keys:
      headline (professional headline, under 9 words),
      shortIntro (1 sentence, first-person, under 22 words, for a hero section),
      bio (2 short paragraphs, first-person, warm and confident, plain text with \\n\\n between paragraphs),
      about (1 paragraph, third-person, for an About page, under 90 words),
      skills (array of 6 specific skill tags),
      services (array of up to 6 objects each with title and oneLiner),
      cta (a short call-to-action sentence, under 12 words).`,
      true
    );
    status.textContent = 'Building your starter website…';
    const website = await askAI(
      `Freelancer: ${d.name}, ${profile.headline}. Bio: ${profile.bio}. Services: ${allServices.join(', ')}. Location: ${d.location}.`,
      `Generate JSON for a one-page freelancer website with keys: seoTitle (under 60 chars), seoDescription (under 155 chars), heroLine (punchy, under 12 words), faq (array of 4 objects with q and a, a under 35 words each), testimonialPlaceholder (one realistic-sounding sample client quote under 30 words, clearly a placeholder example).`,
      true
    );
    STATE.user = {
      name:d.name, location:d.location, experience:d.experience||'Intermediate', skillRaw:d.skill, niche:d.niche,
      targetClients:d.targetClients, email:d.email, whatsapp:d.whatsapp, photo:d.photo||'',
      headline:profile.headline, shortIntro:profile.shortIntro, bio:profile.bio, about:profile.about,
      skills:profile.skills, services:profile.services, cta:profile.cta
    };
    STATE.website = {
      seoTitle:website.seoTitle, seoDescription:website.seoDescription, heroLine:website.heroLine,
      faq:website.faq, testimonial:website.testimonialPlaceholder, social:{instagram:'',tiktok:'',x:'',linkedin:''}
    };
    if((d.portfolioSeed||[]).length){
      STATE.portfolio = d.portfolioSeed.map(p=>({name:p.name, description:p.desc, type:'', results:'', skills:'', improved:false}));
    }
    await S.set('user', STATE.user);
    await S.set('website', STATE.website);
    await S.set('portfolio', STATE.portfolio);
    useCredit(); useCredit();
    toast('Your freelancer brand is ready 🎉');
    go('/dashboard/overview');
  }catch(e){
    console.error(e);
    status.textContent = "Something went wrong reaching the AI. Please try again.";
    btn.innerHTML = '✨ Generate My Profile';
    btn.disabled = false;
  }
}
</script>

  if(creditsLeft()<=0) return showUpgradeModal();
  const platform = document.querySelector('#platSelect .chip.active').textContent;
  const topic = document.getElementById('socTopic').value.trim() || 'promoting my freelance services';
  const btn = document.getElementById('socBtn');
  btn.innerHTML='<span class="spinner spinner-dark"></span> Creating…'; btn.disabled=true;
  const u = STATE.user;
  try{
    const out = await askAI(
      `Freelancer: ${u.headline}, skill: ${u.skillRaw}\nPlatform: ${platform}\nTopic: ${topic}`,
      `Create a ${platform} post for this freelancer. Output JSON with keys: hook (under 12 words, scroll-stopping), caption (2-4 sentences, platform-appropriate tone, include 3-5 relevant hashtags at the end), ideas (array of 3 short follow-up content ideas).`,
      true
    );
    document.getElementById('socOutput').innerHTML = `
      <div class="gen-output"><b>${escapeHtml(out.hook)}</b>\n\n${escapeHtml(out.caption)}</div>
      <div class="muted" style="font-size:13px; margin-top:10px;">More ideas: ${out.ideas.map(escapeHtml).join(' · ')}</div>
      <div class="copy-row">
        <button class="btn btn-ghost btn-sm" onclick="copyText(this)" data-text="${encodeURIComponent(out.hook+'\\n\\n'+out.caption)}">📋 Copy</button>
        <button class="btn btn-primary btn-sm" onclick="saveSocial('${platform}','${encodeURIComponent(out.hook)}','${encodeURIComponent(out.caption)}')">💾 Save</button>
      </div>`;
    useCredit();
  }catch(e){ toast('AI request failed'); }
  btn.innerHTML='✨ Generate content'; btn.disabled=false;
}
async function saveSocial(platform, encHook, encCaption){
  STATE.social.unshift({platform, hook:decodeURIComponent(encHook), caption:decodeURIComponent(encCaption)});
  await S.set('social', STATE.social); render(); toast('Saved');
}
async function deleteSocial(i){ STATE.social.splice(i,1); await S.set('social',STATE.social); render(); }

function SubscriptionView(){
  return `
  <div class="card" style="margin-bottom:22px;">
    <div class="section-title" style="margin-bottom:6px;">Current plan</div>
    <p class="muted" style="font-size:14px; margin-bottom:16px;">You're on the <b style="color:var(--text); text-transform:capitalize;">${STATE.plan}</b> plan · ${creditsLeft()} AI credits left this month</p>
    ${PricingCardsInApp()}
  </div>
  <div class="card">
    <div class="section-title" style="font-size:16px; margin-bottom:8px;">Billing</div>
    <p class="muted" style="font-size:13.5px; margin-bottom:14px;">Payments and invoices are managed securely through Stripe. You'll be redirected to Stripe Checkout to subscribe, and can manage or cancel anytime via the Stripe Customer Portal.</p>
    <button class="btn btn-ghost btn-sm" onclick="toast('This opens the Stripe Customer Portal in production.')">Manage billing</button>
  </div>`;
}
function PricingCardsInApp(){
  const plans = [
    {id:'free', name:'Free', price:'₦0', feats:['Freelancer profile','10 AI generations/mo','Basic portfolio','Basic website + branding']},
    {id:'pro', name:'Pro', price:'₦8,500/mo', feats:['150 AI generations/mo','Unlimited proposals','Custom website, no branding','Custom domain support']},
    {id:'business', name:'Business', price:'₦22,000/mo', feats:['500 AI generations/mo','Multiple websites','Advanced analytics','Priority features']}
  ];
  return `<div class="pricing-grid">${plans.map(p=>`
    <div class="price-card ${STATE.plan===p.id?'featured':''}">
      ${STATE.plan===p.id?'<div class="pill badge-gold">Current</div>':''}
      <h3>${p.name}</h3><div class="amt">${p.price}</div>
      <ul>${p.feats.map(f=>`<li><span class="check">✓</span> ${f}</li>`).join('')}</ul>
      <button class="btn ${STATE.plan===p.id?'btn-ghost':'btn-primary'} btn-block" ${STATE.plan===p.id?'disabled':''} onclick="startCheckout('${p.id}')">${STATE.plan===p.id?'Current plan':'Upgrade — pay with Stripe'}</button>
    </div>`).join('')}</div>`;
}
function startCheckout(planId){
  if(planId==='free'){ return; }
  document.getElementById('dashContent').insertAdjacentHTML('beforeend', `
  <div class="modal-bg" onclick="if(event.target===this)this.remove()">
    <div class="modal" style="text-align:center;">
      <div style="font-size:34px; margin-bottom:10px;">💳</div>
      <h3 style="margin-bottom:10px;">Redirecting to Stripe Checkout</h3>
      <p class="muted" style="font-size:14px; margin-bottom:20px;">In production, this button opens a real Stripe Checkout session for the ${planId} plan. Card details are handled entirely by Stripe — never by AI Freelancer's servers. This demo simulates a successful payment.</p>
      <button class="btn btn-primary btn-block" onclick="simulateUpgrade('${planId}')">Simulate successful payment</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="this.closest('.modal-bg').remove()">Cancel</button>
    </div>
  </div>`);
}
async function simulateUpgrade(planId){
  STATE.plan = planId;
  STATE.usage.limit = planId==='pro'?150:planId==='business'?500:10;
  await S.set('plan', STATE.plan); await S.set('usage', STATE.usage);
  document.querySelector('.modal-bg').remove();
  toast(`Upgraded to ${planId.toUpperCase()} 🎉`);
  render();
}

function SettingsView(){
  const u = STATE.user;
  return `
  <div class="card" style="max-width:560px;">
    <div class="section-title" style="margin-bottom:18px;">Account settings</div>
    <div class="field"><label>Name</label><input value="${escapeHtml(u.name)}" onblur="saveField('user','name',this.value)"/></div>
    <div class="field"><label>Email</label><input value="${escapeHtml(u.email)}" onblur="saveField('user','email',this.value)"/></div>
    <div class="field"><label>WhatsApp</label><input value="${escapeHtml(u.whatsapp)}" onblur="saveField('user','whatsapp',this.value)"/></div>
    <div class="field"><label>Location</label><input value="${escapeHtml(u.location)}" onblur="saveField('user','location',this.value)"/></div>
    <label>Theme</label>
    <div class="chip-select" style="margin-bottom:10px;">
      <span class="chip ${STATE.theme==='light'?'active':''}" onclick="setTheme('light')">☀ Light</span>
      <span class="chip ${STATE.theme==='dark'?'active':''}" onclick="setTheme('dark')">☾ Dark</span>
    </div>
    <hr style="border:none; border-top:1px solid var(--border); margin:20px 0;">
    <p class="muted" style="font-size:13px;">Custom domain support is available on Pro and Business plans.</p>
  </div>`;
}
function setTheme(t){ STATE.theme=t; document.documentElement.setAttribute('data-theme',t); S.set('theme',t); render(); }

function showUpgradeModal(){
  document.getElementById('dashContent')?.insertAdjacentHTML('beforeend', `
  <div class="modal-bg" onclick="if(event.target===this)this.remove()">
    <div class="modal" style="text-align:center;">
      <div style="font-size:32px;">⚡</div>
      <h3 style="margin:10px 0;">You're out of AI credits</h3>
      <p class="muted" style="font-size:14px; margin-bottom:20px;">Upgrade your plan to keep generating proposals, messages and more.</p>
      <a href="#/dashboard/subscription" class="btn btn-primary btn-block" onclick="this.closest('.modal-bg').remove()">View plans</a>
    </div>
  </div>`);
}
</script>
